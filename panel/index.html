<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>K8S</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: var(--oc-bg); color: var(--oc-fg); font-family: var(--oc-font); }
    button, input, textarea, select { font: inherit; }
    .app { height: 100%; display: flex; flex-direction: column; min-width: 0; }
    .topbar { min-height: 48px; display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: var(--oc-muted-surface); border-bottom: 1px solid var(--oc-border); }
    .brand { color: var(--oc-primary-text); font-size: 1.06rem; line-height: 1; font-weight: 750; letter-spacing: .06em; padding: 0 3px; }
    .context { flex: 1; min-width: 150px; max-width: 360px; }
    .refresh { margin-left: auto; }
    .global-banner:empty { display: none; }
    .global-banner { padding: 8px 10px 0; }
    .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 158px minmax(0, 1fr); }
    .sidebar { min-height: 0; overflow-y: auto; padding: 8px 6px 16px; background: var(--oc-muted-surface); border-right: 1px solid var(--oc-border); }
    .nav-group { margin-bottom: 7px; }
    .nav-title { padding: 6px 9px 3px; color: var(--oc-muted); font-size: .65rem; text-transform: uppercase; letter-spacing: .08em; }
    .main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .toolbar { display: flex; align-items: center; gap: 9px; padding: 10px 12px 7px; }
    .section-heading { min-width: 0; flex: 1; }
    .section-heading h1 { margin: 0; font-size: 1rem; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .section-heading p { margin: 2px 0 0; color: var(--oc-muted); font-size: .73rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .namespace { width: 155px; flex: none; }
    .search { padding: 0 12px 8px; }
    .content { flex: 1; min-height: 120px; overflow: auto; padding: 0 12px 12px; }
    .content.with-detail { flex: .9; }
    .center { min-height: 160px; display: grid; place-items: center; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 2px 0 14px; }
    .stat { border: 1px solid var(--oc-border); border-radius: var(--oc-radius); background: var(--oc-elevated); padding: 10px; min-width: 0; }
    .stat-label { color: var(--oc-muted); font-size: .7rem; margin-bottom: 4px; }
    .stat-value { font-size: 1.15rem; font-weight: 650; font-variant-numeric: tabular-nums; }
    .overview-title { margin: 10px 0 6px; font-size: .82rem; font-weight: 650; }
    .overview-meta { color: var(--oc-muted); font-size: .75rem; margin-bottom: 12px; }
    .detail { flex: 1.1; min-height: 180px; display: flex; flex-direction: column; border-top: 1px solid var(--oc-border); background: var(--oc-elevated); }
    .detail[hidden] { display: none; }
    .detail-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px 4px; }
    .detail-name { min-width: 0; }
    .detail-name strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .82rem; }
    .detail-name span { color: var(--oc-muted); font-size: .7rem; }
    .detail-tabs { padding: 0 10px; overflow-x: auto; }
    .detail-body { flex: 1; min-height: 0; overflow: auto; padding: 8px 12px 12px; }
    .detail-actions { display: flex; gap: 6px; align-items: center; }
    .output { min-height: 120px; margin: 0; padding: 10px; overflow: auto; border: 1px solid var(--oc-border); border-radius: var(--oc-radius); background: var(--oc-bg); color: var(--oc-fg); font-family: var(--oc-mono); font-size: .72rem; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
    .hint { color: var(--oc-muted); font-size: .73rem; line-height: 1.45; margin: 0 0 8px; }
    .terminal-form { display: grid; grid-template-columns: minmax(120px, .55fr) minmax(160px, 1.4fr) auto; align-items: end; gap: 8px; margin-bottom: 8px; }
    .terminal-output { margin-top: 8px; }
    .port-form { display: grid; grid-template-columns: minmax(180px, 1.4fr) minmax(80px, .5fr) minmax(80px, .5fr) auto; align-items: end; gap: 8px; padding: 10px; margin-bottom: 12px; border: 1px solid var(--oc-border); border-radius: var(--oc-radius); background: var(--oc-elevated); }
    .port-detail { display: flex; align-items: center; gap: 8px; padding: 10px; margin-top: 10px; border: 1px solid var(--oc-border); border-radius: var(--oc-radius); }
    .port-detail-text { flex: 1; min-width: 0; font-family: var(--oc-mono); font-size: .74rem; overflow: hidden; text-overflow: ellipsis; }
    .empty-filter { padding: 14px 0; }
    @media (max-width: 700px) {
      .layout { grid-template-columns: 122px minmax(0, 1fr); }
      .sidebar { padding-left: 4px; padding-right: 4px; }
      .nav-title { padding-left: 7px; }
      .toolbar { flex-wrap: wrap; }
      .section-heading { min-width: 120px; }
      .namespace { width: 140px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .terminal-form, .port-form { grid-template-columns: 1fr 1fr; }
      .terminal-form > :first-child, .port-form > :first-child { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./main.js"></script>
</body>
</html>
